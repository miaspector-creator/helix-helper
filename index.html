<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Helix Helper DNA sequence analysis tool" />
    <title>Helix Helper</title>
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="app-card" aria-label="DNA sequence analyzer">
        <header class="app-header">
          <div class="brand-mark" aria-hidden="true"></div>
          <h1>Helix Helper</h1>
        </header>

        <div class="app-body">
          <label class="section-label" for="sequence-input">DNA sequence</label>
          <textarea
            id="sequence-input"
            class="sequence-input"
            spellcheck="false"
            autocapitalize="characters"
            aria-label="Paste DNA sequence"
            placeholder="Paste a DNA sequence to start."
          ></textarea>

          <div class="tool-row">
            <button id="analyze-button" class="button primary" type="button">Analyze sequence</button>
            <button id="example-button" class="button secondary" type="button">Use example</button>
            <button id="reset-button" class="button tertiary" type="button">Reset</button>
          </div>

          <div id="message-box" class="message-box" role="alert" aria-live="assertive" hidden></div>

          <section id="results" class="results" hidden>
            <h2 class="results-header">Results</h2>
            <div class="result-grid">
              <div class="result-item">
                <span class="result-label">Original sequence</span>
                <div class="result-line">
                  <output id="result-original" for="sequence-input"></output>
                  <button class="copy-button" type="button" data-copy-target="result-original">Copy</button>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">Cleaned sequence</span>
                <div class="result-line">
                  <output id="result-cleaned"></output>
                  <button class="copy-button" type="button" data-copy-target="result-cleaned">Copy</button>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">Length</span>
                <div class="result-line">
                  <output id="result-length"></output>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">GC %</span>
                <div class="result-line">
                  <output id="result-gc"></output>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">GC working</span>
                <div class="result-line">
                  <output id="result-gc-summary"></output>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">Reverse complement</span>
                <div class="result-line">
                  <output id="result-reverse"></output>
                  <button class="copy-button" type="button" data-copy-target="result-reverse">Copy</button>
                </div>
              </div>

              <div class="result-item">
                <span class="result-label">RNA</span>
                <div class="result-line">
                  <output id="result-rna"></output>
                  <button class="copy-button" type="button" data-copy-target="result-rna">Copy</button>
                </div>
              </div>
            </div>
          </section>
        </div>
      </section>
    </main>

    <script src="./js/logic.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
