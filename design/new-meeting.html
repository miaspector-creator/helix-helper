<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Meeting Reference</title>
    <style>
      :root {
        --bg: #091915;
        --panel: rgba(12, 33, 28, 0.9);
        --panel-soft: rgba(16, 40, 33, 0.7);
        --line: rgba(167, 202, 195, 0.20);
        --text: #eef9f6;
        --muted: #afd4cb;
        --primary: #70f0be;
        --secondary: #7bc0ff;
        --warning: #ffdf88;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(112, 240, 190, 0.15), transparent 28%),
          linear-gradient(135deg, var(--bg), #0d1e1a 28%, #12362d 100%);
        color: var(--text);
        font-family: Arial, sans-serif;
      }

      .mockup {
        width: min(92vw, 640px);
        padding: 18px;
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 20px 48px rgba(0, 0, 0, 0.35);
      }

      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line);
      }

      .brand {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-weight: 700;
        letter-spacing: 0.04em;
      }

      .logo {
        width: 42px;
        height: 42px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 12px;
        background: rgba(112, 240, 190, 0.12);
        color: var(--primary);
        border: 1px solid rgba(112, 240, 190, 0.28);
      }

      .panel {
        margin-top: 18px;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: rgba(13, 26, 22, 0.6);
        padding: 16px;
      }

      .textarea {
        width: 100%;
        min-height: 160px;
        border-radius: 14px;
        border: 1px solid var(--line);
        background: rgba(8, 16, 14, 0.3);
        color: var(--text);
        padding: 14px;
        font-family: monospace;
        font-size: 16px;
      }

      .actions {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .button {
        min-height: 44px;
        padding: 0 16px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(123, 192, 255, 0.08);
        color: var(--text);
        font-weight: 700;
      }

      .button.primary {
        background: linear-gradient(135deg, var(--primary), #2fc798);
        color: #032a24;
        border-color: transparent;
      }

      .results {
        display: grid;
        gap: 10px;
        margin-top: 18px;
      }

      .row {
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 12px 14px;
        background: var(--panel-soft);
      }

      .label {
        color: var(--muted);
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }

      .value {
        margin-top: 8px;
        font-family: monospace;
        word-break: break-all;
      }
    </style>
  </head>
  <body>
    <div class="mockup">
      <div class="header">
        <div class="brand">
          <span class="logo">H</span>
          <span>Helix Helper</span>
        </div>
      </div>

      <div class="panel">
        <textarea class="textarea">ATGGCCATTGTAATGGGCCGC</textarea>
        <div class="actions">
          <button class="button primary" type="button">Analyze sequence</button>
          <button class="button" type="button">Use example</button>
          <button class="button" type="button">Reset</button>
        </div>
      </div>

      <div class="results">
        <div class="row">
          <div class="label">Original sequence</div>
          <div class="value">ATGGCCATTGTAATGGGCCGC</div>
        </div>
        <div class="row">
          <div class="label">Cleaned sequence</div>
          <div class="value">ATGGCCATTGTAATGGGCCGC</div>
        </div>
        <div class="row">
          <div class="label">GC %</div>
          <div class="value">57.1%</div>
        </div>
      </div>
    </div>
  </body>
</html>
